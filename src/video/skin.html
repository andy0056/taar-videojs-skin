<media-container class="media-skin media-container media-video taar" data-theme="scaffold" data-preset="video">
<!-- Add a compatible media component here. -->
<media-poster class="media-poster">
<img alt="" decoding="async" class="media-poster-image">
</media-poster>
<media-error-dialog>
<media-dialog-backdrop class="media-dialog-backdrop">
</media-dialog-backdrop>
<media-dialog-popup class="media-dialog-popup">
<media-dialog-title class="media-dialog-title">
</media-dialog-title>
<media-dialog-description class="media-dialog-description">
</media-dialog-description>
<media-dialog-close class="media-button media-dialog-close">
</media-dialog-close>
</media-dialog-popup>
</media-error-dialog>
<media-controls>
<media-controls-backdrop class="taar-scrim">
</media-controls-backdrop>

<!-- The line. One stroke runs through every control marked with data-taar below. -->
<taar-line class="taar-line">
</taar-line>

<media-controls-group class="media-buffering-indicator-controls">
<media-buffering-indicator class="media-buffering-indicator taar-buffering">
<media-icon family="taar" name="spinner" class="media-buffering-indicator-spinner-icon">
</media-icon>
</media-buffering-indicator>
</media-controls-group>
<media-controls-content class="video-controls-content taar-content">
<media-tooltip-group>

<!-- Top right: device buttons, shown only where the platform has them. -->
<media-controls-group class="taar-top">
<media-airplay-button class="media-button taar-device media-airplay-button" id="taar-airplay">
<media-icon family="taar" name="airplay-enter" class="media-button-icon media-airplay-button-enter-icon">
</media-icon>
<media-icon family="taar" name="airplay-exit" class="media-button-icon media-airplay-button-exit-icon">
</media-icon>
</media-airplay-button>
<media-tooltip trigger="taar-airplay" side="bottom" class="media-popup media-popup-safe-area media-tooltip-popup taar-tip">
<media-tooltip-label>
</media-tooltip-label>
<media-tooltip-shortcut class="media-tooltip-shortcut">
</media-tooltip-shortcut>
</media-tooltip>
<media-cast-button class="media-button taar-device media-cast-button" id="taar-cast">
<media-icon family="taar" name="cast-enter" class="media-button-icon media-cast-button-enter-icon">
</media-icon>
<media-icon family="taar" name="cast-exit" class="media-button-icon media-cast-button-exit-icon">
</media-icon>
</media-cast-button>
<media-tooltip trigger="taar-cast" side="bottom" class="media-popup media-popup-safe-area media-tooltip-popup taar-tip">
<media-tooltip-label>
</media-tooltip-label>
<media-tooltip-shortcut class="media-tooltip-shortcut">
</media-tooltip-shortcut>
</media-tooltip>
</media-controls-group>

<!-- Before playback the title and the running time stand on the horizon. -->
<div class="taar-horizon">
<media-title class="taar-title">
</media-title>
<media-time class="taar-time taar-horizon-time" type="duration">
</media-time>
</div>

<!-- The bar. Its buttons are hit targets and focus stops; what you see of them is drawn by the line. -->
<div class="taar-bar">
<div class="taar-play-slot">
<media-play-button class="media-button taar-button taar-play" id="taar-play" data-taar="play">
</media-play-button>
</div>
<media-tooltip trigger="taar-play" side="top" class="media-popup media-popup-safe-area media-tooltip-popup taar-tip">
<media-tooltip-label>
</media-tooltip-label>
<media-tooltip-shortcut class="media-tooltip-shortcut">
</media-tooltip-shortcut>
</media-tooltip>
<!-- The string and the two times that stand on it. On narrow players the times step onto the string itself. -->
<div class="taar-string">
<media-time class="taar-time taar-time-current" type="current">
</media-time>
<media-time-slider class="taar-seek" data-taar="seek">
<media-slider-thumb class="taar-seek-thumb">
</media-slider-thumb>
<media-slider-preview class="taar-seek-preview" overflow="clamp">
<media-slider-thumbnail class="taar-seek-thumbnail">
</media-slider-thumbnail>
<div class="taar-seek-meta">
<media-time-slider-chapter-title class="taar-seek-chapter">
</media-time-slider-chapter-title>
<media-slider-value class="taar-seek-value" type="pointer">
</media-slider-value>
</div>
</media-slider-preview>
</media-time-slider>
<media-time class="taar-time taar-time-duration" type="duration">
</media-time>
</div>
<media-controls-group class="taar-tools">
<media-mute-button class="media-button taar-button media-mute-button" id="taar-mute" data-taar="volume" commandfor="taar-volume-popup">
</media-mute-button>
<media-tooltip trigger="taar-mute" delay="0" disabled side="top" sticky class="media-popup media-popup-safe-area media-tooltip-popup taar-tip">
<media-tooltip-label>
</media-tooltip-label>
<media-tooltip-shortcut class="media-tooltip-shortcut">
</media-tooltip-shortcut>
</media-tooltip>
<media-volume-popover open-on-hover delay="120" close-delay="140" side="top" class="media-popup media-popup-safe-area taar-volume-popup" id="taar-volume-popup">
<media-volume-slider class="taar-level" data-taar="level" orientation="vertical">
<media-slider-thumb class="taar-level-thumb">
</media-slider-thumb>
</media-volume-slider>
</media-volume-popover>
<media-captions-button class="media-button taar-button media-captions-button" id="taar-captions" data-taar="captions">
</media-captions-button>
<media-tooltip trigger="taar-captions" side="top" class="media-popup media-popup-safe-area media-tooltip-popup taar-tip">
<media-tooltip-label>
</media-tooltip-label>
<media-tooltip-shortcut class="media-tooltip-shortcut">
</media-tooltip-shortcut>
</media-tooltip>
<button commandfor="taar-settings-popup" class="media-button taar-button taar-settings" id="taar-settings" data-taar="settings">
<media-text token="menu.settings" class="taar-sr">Settings</media-text>
</button>
<media-tooltip trigger="taar-settings" side="top" class="media-popup media-popup-safe-area media-tooltip-popup taar-tip">
<media-tooltip-label>
<media-text token="menu.settings">Settings</media-text>
</media-tooltip-label>
</media-tooltip>
<media-menu side="top" align="end" class="media-popup media-popup-safe-area media-menu-popup taar-menu" id="taar-settings-popup">
<media-menu-content class="media-menu-content">
<media-menu-item commandfor="taar-menu-speed" class="media-menu-item">
<media-icon family="taar" name="speed" class="media-menu-trigger-icon">
</media-icon>
<media-text token="menu.speed">Speed</media-text>
<span class="media-menu-hint">
<span data-part="value" class="media-menu-hint-label">
</span>
<media-icon family="taar" name="chevron" class="media-menu-forward-chevron">
</media-icon>
</span>
</media-menu-item>
<media-menu-item commandfor="taar-menu-captions" class="media-menu-item">
<media-icon family="taar" name="captions" class="media-menu-trigger-icon">
</media-icon>
<media-text token="menu.captions">Captions</media-text>
<span class="media-menu-hint">
<span data-part="value" class="media-menu-hint-label">
</span>
<media-icon family="taar" name="chevron" class="media-menu-forward-chevron">
</media-icon>
</span>
</media-menu-item>
<media-menu-item commandfor="taar-menu-quality" class="media-menu-item">
<media-icon family="taar" name="quality" class="media-menu-trigger-icon">
</media-icon>
<media-text token="menu.quality">Quality</media-text>
<span class="media-menu-hint">
<span data-part="value" class="media-menu-hint-label">
</span>
<media-icon family="taar" name="chevron" class="media-menu-forward-chevron">
</media-icon>
</span>
</media-menu-item>
<media-menu-item commandfor="taar-menu-audio" class="media-menu-item">
<media-icon family="taar" name="audio" class="media-menu-trigger-icon">
</media-icon>
<media-text token="menu.audio">Audio</media-text>
<span class="media-menu-hint">
<span data-part="value" class="media-menu-hint-label">
</span>
<media-icon family="taar" name="chevron" class="media-menu-forward-chevron">
</media-icon>
</span>
</media-menu-item>
</media-menu-content>
<media-menu-content class="media-menu-content" id="taar-menu-speed">
<media-menu-item class="media-menu-back-item">
<media-icon family="taar" name="chevron" class="media-menu-back-chevron">
</media-icon>
<media-text token="menu.speed">Speed</media-text>
</media-menu-item>
<media-menu-separator class="media-menu-separator">
</media-menu-separator>
<media-playback-rate-radio-group class="media-menu-radio-group">
<template>
<media-menu-radio-item class="media-menu-radio-item">
<span data-part="label">
</span>
<media-menu-item-indicator force-mount class="media-menu-indicator">
<media-icon family="taar" name="check" class="media-menu-radio-icon">
</media-icon>
</media-menu-item-indicator>
</media-menu-radio-item>
</template>
</media-playback-rate-radio-group>
</media-menu-content>
<media-menu-content class="media-menu-content" id="taar-menu-captions">
<media-menu-item class="media-menu-back-item">
<media-icon family="taar" name="chevron" class="media-menu-back-chevron">
</media-icon>
<media-text token="menu.captions">Captions</media-text>
</media-menu-item>
<media-menu-separator class="media-menu-separator">
</media-menu-separator>
<media-captions-radio-group class="media-menu-radio-group">
<template>
<media-menu-radio-item class="media-menu-radio-item">
<span data-part="label">
</span>
<media-menu-item-indicator force-mount class="media-menu-indicator">
<media-icon family="taar" name="check" class="media-menu-radio-icon">
</media-icon>
</media-menu-item-indicator>
</media-menu-radio-item>
</template>
</media-captions-radio-group>
</media-menu-content>
<media-menu-content class="media-menu-content" id="taar-menu-quality">
<media-menu-item class="media-menu-back-item">
<media-icon family="taar" name="chevron" class="media-menu-back-chevron">
</media-icon>
<media-text token="menu.quality">Quality</media-text>
</media-menu-item>
<media-menu-separator class="media-menu-separator">
</media-menu-separator>
<media-quality-radio-group class="media-menu-radio-group">
<template>
<media-menu-radio-item class="media-menu-radio-item">
<span>
<span data-part="label">
</span>
<sup data-part="tier" class="media-menu-tier">
</sup>
</span>
<span data-part="badge" class="media-menu-badge">
</span>
<media-menu-item-indicator force-mount class="media-menu-indicator">
<media-icon family="taar" name="check" class="media-menu-radio-icon">
</media-icon>
</media-menu-item-indicator>
</media-menu-radio-item>
</template>
</media-quality-radio-group>
</media-menu-content>
<media-menu-content class="media-menu-content" id="taar-menu-audio">
<media-menu-item class="media-menu-back-item">
<media-icon family="taar" name="chevron" class="media-menu-back-chevron">
</media-icon>
<media-text token="menu.audio">Audio</media-text>
</media-menu-item>
<media-menu-separator class="media-menu-separator">
</media-menu-separator>
<media-audio-track-radio-group class="media-menu-radio-group">
<template>
<media-menu-radio-item class="media-menu-radio-item">
<span data-part="label">
</span>
<media-menu-item-indicator force-mount class="media-menu-indicator">
<media-icon family="taar" name="check" class="media-menu-radio-icon">
</media-icon>
</media-menu-item-indicator>
</media-menu-radio-item>
</template>
</media-audio-track-radio-group>
</media-menu-content>
</media-menu>
<media-pip-button class="media-button taar-button media-pip-button" id="taar-pip" data-taar="pip">
</media-pip-button>
<media-tooltip trigger="taar-pip" side="top" class="media-popup media-popup-safe-area media-tooltip-popup taar-tip">
<media-tooltip-label>
</media-tooltip-label>
<media-tooltip-shortcut class="media-tooltip-shortcut">
</media-tooltip-shortcut>
</media-tooltip>
<media-fullscreen-button class="media-button taar-button media-fullscreen-button" id="taar-fullscreen" data-taar="fullscreen">
</media-fullscreen-button>
<media-tooltip trigger="taar-fullscreen" side="top" align="end" class="media-popup media-popup-safe-area media-tooltip-popup taar-tip">
<media-tooltip-label>
</media-tooltip-label>
<media-tooltip-shortcut class="media-tooltip-shortcut">
</media-tooltip-shortcut>
</media-tooltip>
</media-controls-group>
</div>

</media-tooltip-group>
</media-controls-content>
</media-controls>

</media-hotkey>
<media-hotkey keys="k" action="togglePaused">
</media-hotkey>
<media-hotkey keys="m" action="toggleMuted">
</media-hotkey>
<media-hotkey keys="ArrowRight" action="seekStep">
</media-hotkey>
<media-hotkey keys="ArrowLeft" action="seekStep">
</media-hotkey>
<media-hotkey keys="l" action="seekStep">
</media-hotkey>
<media-hotkey keys="j" action="seekStep">
</media-hotkey>
<media-hotkey keys="ArrowUp" action="volumeStep">
</media-hotkey>
<media-hotkey keys="ArrowDown" action="volumeStep">
</media-hotkey>
<media-hotkey keys="0-9" action="seekToPercent">
</media-hotkey>
<media-hotkey keys="Home" action="seekToPercent" value="0">

<media-hotkey keys="End" action="seekToPercent" value="100">

</span>
</media-status-announcer>
<div class="media-indicator-group">
<media-volume-indicator class="media-indicator media-volume-indicator" hidden>
<media-volume-indicator-fill class="media-volume-indicator-fill">
<media-icon family="taar" name="volume-high" class="media-volume-indicator-icon media-volume-indicator-high-icon">
</media-icon>
<media-icon family="taar" name="volume-low" class="media-volume-indicator-icon media-volume-indicator-low-icon">

<media-icon family="taar" name="volume-off" class="media-volume-indicator-icon media-volume-indicator-off-icon">
</media-icon>
<media-volume-indicator-value class="media-volume-indicator-value">
</media-volume-indicator-value>
</media-volume-indicator-fill>
</media-volume-indicator>
<media-status-indicator actions="toggleSubtitles,toggleFullscreen,togglePictureInPicture" class="media-indicator media-status-indicator" hidden>
<media-icon family="taar" name="captions-on" class="media-status-indicator-icon media-status-indicator-captions-on-icon">
</media-icon>
<media-icon family="taar" name="captions-off" class="media-status-indicator-icon media-status-indicator-captions-off-icon">

<media-icon family="taar" name="pip-exit" class="media-status-indicator-icon media-status-indicator-pip-exit-icon">
</media-icon>
<media-status-indicator-value>

</media-status-indicator>

<media-seek-indicator-value class="media-seek-indicator-value">

</media-seek-indicator>
</div>
</media-container>
